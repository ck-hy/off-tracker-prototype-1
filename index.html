<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17766a">
<title>Off Tracker — Prototype</title>
<style>
:root{--bg:#e9f0ee;--card:#fff;--ink:#12302f;--mute:#5d7573;--line:#cfdcd9;--acc:#17766a;--accfg:#fff;--warn:#b45309;--warnbg:#fdf0dc;--bad:#b4234a;--badbg:#fbe4ea;--ok:#17766a;--okbg:#dcf1ec}
*{box-sizing:border-box}html{scroll-padding-top:70px}body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;min-width:320px}.wrap{max-width:920px;margin:0 auto;padding:12px 16px 60px}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 0 14px;background:var(--bg)}h1{font-size:1.35rem;margin:0;font-weight:800}h2{font-size:1.08rem;margin:0 0 12px;font-weight:700}.who{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:.9rem}.menu-wrap{position:relative}.menu-toggle{white-space:nowrap}.user-menu{position:absolute;right:0;top:calc(100% + 7px);z-index:8;width:min(270px,calc(100vw - 24px));padding:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgb(0 0 0 / .16)}.user-menu[hidden]{display:none}.user-menu button{display:block;width:100%;min-height:42px;padding:9px 11px;background:transparent;color:var(--ink);text-align:left;border-radius:7px}.user-menu button:hover,.user-menu button:focus-visible{background:var(--bg)}.menu-account{padding:9px 11px;border-bottom:1px solid var(--line);margin-bottom:4px}.menu-account strong{display:block;color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}button{font:inherit;font-weight:650;min-height:44px;padding:9px 14px;border:0;border-radius:8px;background:var(--acc);color:var(--accfg);cursor:pointer;touch-action:manipulation}button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}button.bad{background:var(--badbg);color:var(--bad)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}input,select,textarea{width:100%;font:inherit;padding:9px 10px;min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}textarea{resize:vertical;min-height:82px}label{display:block;font-size:.9rem;font-weight:650;margin:10px 0 4px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.muted{color:var(--mute);font-size:.9rem}.error{color:var(--bad);min-height:1.3em;font-size:.9rem}.notice{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:10px 13px;margin-bottom:14px;font-weight:600}.prototype{background:#fff4cf;color:#7a4b00;border:1px solid #edd28a;border-radius:10px;padding:10px 13px;margin-bottom:14px}.login{max-width:420px;margin:7vh auto 0}.demo{background:var(--bg);border-radius:10px;padding:10px 12px;margin-top:14px;font-size:.9rem}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.tab{background:transparent;color:var(--ink);border:1px solid var(--line);flex:1 1 120px}.tab.on{background:var(--acc);color:var(--accfg);border-color:var(--acc)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.actions button{flex:1 1 130px}.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}table{width:100%;border-collapse:collapse;font-size:.92rem}th,td{text-align:left;padding:9px 6px;border-top:1px solid var(--line);vertical-align:top}th{border-top:0;color:var(--mute);font-weight:650}.pill{display:inline-block;border-radius:99px;padding:2px 9px;font-size:.78rem;font-weight:700}.approved{background:var(--okbg);color:var(--ok)}.pending{background:var(--warnbg);color:var(--warn)}.rejected{background:var(--badbg);color:var(--bad)}.req{border-top:1px solid var(--line);padding:13px 0}.req:first-child{border-top:0}.reqtop{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.remarks{white-space:pre-wrap;color:var(--mute);border-left:3px solid var(--line);padding-left:10px;margin-top:7px}.hero{display:flex;align-items:baseline;gap:10px}.big{font-size:4rem;font-weight:800;line-height:1}.batch{border-top:1px solid var(--line);padding:10px 0}.batch strong{font-size:1.15rem}.batch small{display:block;color:var(--mute)}.mnav{display:flex;align-items:center;gap:7px;margin-bottom:10px}.mnav h2{flex:1;text-align:center;margin:0}.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}.dow{text-align:center;color:var(--mute);font-size:.75rem;padding:2px}.day{min-height:86px;text-align:left;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:5px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:7px;font-weight:400;overflow:hidden}.day.today{border-color:var(--acc)}.day.selected{outline:3px solid var(--acc);outline-offset:-1px}.day b{font-size:.82rem}.shift{font-size:.62rem;line-height:1.15;color:var(--mute);overflow-wrap:anywhere}.shift.low{color:var(--warn);font-weight:700}.off{font-size:.65rem;color:var(--bad);font-weight:700}.form-title{font-weight:700;margin:0 0 5px}.right{display:flex;justify-content:flex-end}.empty{color:var(--mute);padding:8px 0}.checklist{border:1px solid var(--line);border-radius:9px;padding:7px 11px}.checklist label{font-weight:400;margin:5px 0}.checklist input{width:auto;min-height:0;vertical-align:middle}
@media(max-width:600px){.wrap{padding:8px 10px 46px}header{padding:8px 0 10px}h1{font-size:1.18rem}.who{width:100%;justify-content:space-between;font-size:.82rem}.user-menu{position:fixed;right:10px;top:70px}.card{padding:14px;border-radius:12px;margin-bottom:11px}.row{grid-template-columns:1fr}.tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.tab{width:100%}.mnav button{padding:8px 9px;min-width:58px}.mnav h2{font-size:1rem}.day{min-height:80px;padding:4px 3px}.day b{font-size:.75rem}.shift,.off{font-size:.52rem}th,td{font-size:.82rem;padding:8px 4px}.big{font-size:3.4rem}}
</style>
</head>
<body><main class="wrap" id="app"></main>
<script>
'use strict';
const KEY='offtracker-prototype-v050';
const CYCLE=['PM','PM','AM','AM','OFF','OFF'];
const PLATOONS=['1','2','3'];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const date=d=>new Date(d+'T00:00:00');
const today=()=>iso(new Date());
const addDays=(value,n)=>{const d=date(value);d.setDate(d.getDate()+n);return iso(d)};
const addYears=(value,n)=>{const d=date(value);d.setFullYear(d.getFullYear()+n);return iso(d)};
const diff=(a,b)=>Math.round((date(b)-date(a))/864e5);
const fmt=d=>date(d).toLocaleDateString('en-SG',{day:'numeric',month:'short',year:'numeric'});
const validDate=s=>/^\d{4}-\d{2}-\d{2}$/.test(String(s||''))&&!Number.isNaN(date(s).getTime());
const phase={1:4,2:2,3:0};
let ui={view:'dashboard',month:today().slice(0,7),selected:null};
let session=localStorage.getItem(KEY+':session')||'';

function starter(){return{anchor:'2026-09-02',next:1,users:{
  admin:{id:'admin',password:'admin123',name:'Global Administrator',role:'admin',access:'admin',platoon:null,batches:[]},
  p1manager:{id:'p1manager',password:'manager123',name:'Platoon 1 Manager',role:'admin',access:'manager',platoon:'1',batches:[]},
  p2manager:{id:'p2manager',password:'manager123',name:'Platoon 2 Manager',role:'admin',access:'manager',platoon:'2',batches:[]},
  p3manager:{id:'p3manager',password:'manager123',name:'Platoon 3 Manager',role:'admin',access:'manager',platoon:'3',batches:[]},
  alice:{id:'alice',password:'alice123',name:'Alice Tan',role:'user',access:'user',platoon:'1',batches:[{days:2,expires:addDays(today(),30),category:'Events',remarks:'Demo event grant'}]},
  ben:{id:'ben',password:'ben123',name:'Ben Lim',role:'user',access:'user',platoon:'2',batches:[{days:1.5,expires:addDays(today(),45),category:'Recalled',remarks:'Demo recall grant'}]},
  carol:{id:'carol',password:'carol123',name:'Carol Ng',role:'user',access:'user',platoon:'3',batches:[{days:2,expires:addDays(today(),60),category:'Awards',remarks:'Demo award grant'}]}
},requests:[]}}
function load(){try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');return saved&&saved.users?saved:starter()}catch{return starter()}}
let state=load();
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function resetDemo(){if(confirm('Reset the browser-only demo data?')){state=starter();session='';localStorage.removeItem(KEY+':session');save();render()}}
function current(){return state.users[session]||null}
function isManager(){return current()?.access==='manager'}
function isAdmin(){return current()?.role==='admin'}
function visiblePlatoons(){return isManager()?[current().platoon]:PLATOONS}
function visibleUsers(){const p=isManager()?current().platoon:null;return Object.values(state.users).filter(u=>u.role==='user'&&(!p||u.platoon===p))}
function scheduleEnd(){return addYears(state.anchor,5)}
function inRange(d){return d>=state.anchor&&d<=scheduleEnd()}
function shiftFor(p,d){if(!inRange(d))return null;return CYCLE[((diff(state.anchor,d)+phase[p])%6+6)%6]}
function balance(u){return (u?.batches||[]).filter(b=>b.expires>=today()&&b.days>0).reduce((n,b)=>n+Number(b.days),0)}
function pending(u){return state.requests.filter(r=>r.user===u.id&&r.status==='pending').reduce((n,r)=>n+Number(r.days),0)}
function platoonName(p){return p?'Platoon '+p:'Unassigned'}
function accessName(u){return u.access==='manager'?platoonName(u.platoon)+' manager':u.access==='admin'?'Administrator':'Employee'}
function toast(message){const e=document.createElement('div');e.textContent=message;e.style='position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:10;background:#12302f;color:#fff;padding:10px 16px;border-radius:9px;font-weight:650';document.body.appendChild(e);setTimeout(()=>e.remove(),3000)}
function userMenu(u){const items=u.role==='admin'?[['menu-tab','requests','Applications'],['menu-tab','dashboard','Dashboard'],['menu-tab','staff','Staff'],['menu-tab','grant','Grant off']]:[['menu-scroll','balance','My off balance'],['menu-scroll','apply','Apply for off'],['menu-scroll','applications','My applications']];return`<div class="menu-wrap"><button class="ghost menu-toggle" data-action="user-menu" aria-expanded="false" aria-controls="user-menu">☰ Menu</button><div class="user-menu" id="user-menu" hidden><div class="menu-account"><strong>${esc(u.name)}</strong><span>${esc(accessName(u))}</span></div>${items.map(([a,target,label])=>`<button data-action="${a}" data-target="${target}" data-view="${target}">${label}</button>`).join('')}<button data-action="reset">Reset demo data</button><button data-action="logout">Sign out</button></div></div>`}

function render(){
  const app=$('#app'),u=current();
  if(!u){app.innerHTML=loginView();return}
  const header=`<header><h1>Off Tracker <span class="muted">· Prototype</span></h1><div class="who"><span>${esc(u.name)} · ${esc(accessName(u))}</span>${userMenu(u)}</div></header>`;
  const warning=`<div class="prototype"><strong>Prototype only.</strong> This version uses browser storage, has no server security, and is not suitable for real staff records. Use the Node.js version for real deployment.</div>`;
  app.innerHTML=header+warning+(u.role==='user'?employeeView(u):adminShell(u));
}
function loginView(){return`<section class="card login"><h1>Off Tracker · Prototype</h1><p class="muted">Standalone demo. Open this file directly in a browser; Node.js is not required.</p><form id="login"><label for="username">Username</label><input id="username" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><div class="error" id="loginError"></div><button style="width:100%">Sign in</button></form><div class="demo"><strong>Demo logins</strong><br>Global admin: <code>admin</code> / <code>admin123</code><br>Platoon manager: <code>p1manager</code> / <code>manager123</code><br>Employee: <code>alice</code> / <code>alice123</code></div></section>`}
function adminShell(u){const waiting=state.requests.filter(r=>(!isManager()||state.users[r.user]?.platoon===u.platoon)&&(r.status==='pending')).length;const tabs=[['dashboard','Dashboard'],['staff','Staff'],['grant','Grant off'],['requests','Requests']];return`<div class="notice">${isManager()?`<strong>${platoonName(u.platoon)} section</strong> — this demo manager only sees that platoon.`:'<strong>All platoons</strong> — global administrator view.'}</div><nav class="tabs">${tabs.map(([k,label])=>`<button class="tab ${ui.view===k?'on':''}" data-action="tab" data-view="${k}">${label}${k==='requests'&&waiting?' ('+waiting+')':''}</button>`).join('')}</nav>${ui.view==='staff'?staffView():ui.view==='grant'?grantView():ui.view==='requests'?requestsView():dashboardView()}`}
function employeeView(u){const mine=state.requests.filter(r=>r.user===u.id).sort((a,b)=>b.created-a.created),bs=u.batches.filter(b=>b.expires>=today()&&b.days>0);return`<section class="card" id="balance"><h2>Your off balance</h2><div class="hero"><span class="big">${balance(u)}</span><span>day${balance(u)===1?'':'s'} available${pending(u)?` <span class="muted">(${pending(u)} pending)</span>`:''}</span></div>${bs.length?bs.map(b=>`<div class="batch"><strong>${b.days} day${b.days===1?'':'s'} · ${esc(b.category)}</strong><small>Expires ${fmt(b.expires)}${b.remarks?' · '+esc(b.remarks):''}</small></div>`).join(''):'<p class="empty">No off balance right now.</p>'}</section><section class="card"><h2>Apply for off</h2><form id="apply"><div class="row"><div><label for="start">Start date</label><input id="start" type="date" min="${today()}" required></div><div><label for="days">Number of days</label><input id="days" type="number" min="0.5" step="0.5" max="${Math.max(0,balance(u)-pending(u))}" required></div></div><label for="applyRemarks">Remarks</label><textarea id="applyRemarks" maxlength="2000" placeholder="Reason or anything your manager should know"></textarea><div class="error" id="applyError"></div><button>Submit application</button></form></section><section class="card" id="applications"><h2>Your applications</h2>${mine.length?mine.map(requestRow).join(''):'<p class="empty">No applications yet.</p>'}</section>`}
function requestRow(r){return`<div class="req"><div class="reqtop"><strong>${fmt(r.start)} · ${r.days} day${r.days===1?'':'s'}</strong><span class="pill ${r.status==='approved'?'approved':r.status==='pending'?'pending':'rejected'}">${esc(r.status)}</span></div>${r.remarks?`<div class="remarks">${esc(r.remarks)}</div>`:''}</div>`}
function dashboardView(){
  const min=state.anchor.slice(0,7),max=scheduleEnd().slice(0,7);if(ui.month<min)ui.month=min;if(ui.month>max)ui.month=max;
  const [y,m]=ui.month.split('-').map(Number),daysInMonth=new Date(y,m,0).getDate(),pad=(new Date(y,m-1,1).getDay()+6)%7,selected=ui.selected&&inRange(ui.selected)?ui.selected:(inRange(today())?today():state.anchor),visible=visiblePlatoons();
  let cells=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="dow">${d}</div>`).join('')+'<div></div>'.repeat(pad);
  for(let day=1;day<=daysInMonth;day++){const d=ui.month+'-'+String(day).padStart(2,'0'),lines=inRange(d)?visible.map(p=>({p,s:shiftFor(p,d)})).filter(x=>x.s==='AM'||x.s==='PM').map(x=>`<span class="shift">${x.s} P${x.p}</span>`).join(''):'';cells+=`<button class="day ${d===selected?'selected':''} ${d===today()?'today':''}" data-action="day" data-date="${d}"><b>${day}</b>${lines}</button>`}
  const details=visible.map(p=>{const s=shiftFor(p,selected);return`<div class="req"><div class="reqtop"><strong>${platoonName(p)}: ${s?esc(s==='OFF'?'rest day':s+' shift'):'outside schedule'}</strong><span class="muted">${s&&s!=='OFF'?(visibleUsers().filter(u=>u.platoon===p).length+' employees'):s==='OFF'?'Not scheduled':'Not scheduled'}</span></div></div>`}).join('');
  const control=!isManager()?`<section class="card"><h2>Shift pattern</h2><p class="muted">Platoon 3: PM, PM, AM, AM, Off, Off. Platoon 1 is off during Platoon 3 PM; Platoon 2 is off during Platoon 3 AM. This browser demo calculates five years from the anchor date.</p><form id="pattern"><div class="row"><div><label for="anchor">First PM day for Platoon 3</label><input id="anchor" type="date" value="${state.anchor}" required></div><div><label>Schedule ends</label><input value="${scheduleEnd()}" disabled></div></div><div class="error" id="patternError"></div><button>Save shift pattern</button></form></section>`:'';
  return`<section class="card"><div class="mnav"><button class="ghost" data-action="month" data-step="-1">Prev</button><h2>${new Date(y,m-1,1).toLocaleDateString('en-SG',{month:'long',year:'numeric'})}</h2><button class="ghost" data-action="month" data-step="1">Next</button></div><div class="cal">${cells}</div><p class="muted">Schedule: ${fmt(state.anchor)} to ${fmt(scheduleEnd())}. AM/PM entries show the working platoons.</p></section><section class="card"><h2>${fmt(selected)}</h2>${details}</section>${control}`}
function staffView(){
  const users=visibleUsers(),managers=Object.values(state.users).filter(u=>u.access==='manager');
  const options=p=>[['','Unassigned'],...PLATOONS.map(x=>[x,platoonName(x)])].map(([v,l])=>`<option value="${v}" ${(p||'')===v?'selected':''}>${l}</option>`).join('');
  const rows=users.map(u=>`<tr><td>${esc(u.name)}</td><td>${!isManager()?`<select data-action="assign" data-id="${esc(u.id)}" aria-label="Platoon for ${esc(u.name)}">${options(u.platoon)}</select>`:platoonName(u.platoon)}</td><td><strong>${balance(u)}d</strong></td><td>${u.batches.filter(b=>b.expires>=today()&&b.days>0).map(b=>`${b.days}d · ${esc(b.category)}${b.remarks?' — '+esc(b.remarks):''}`).join('<br>')||'-'}</td></tr>`).join('');
  const managerCard=!isManager()?`<section class="card"><h2>Platoon managers</h2><p class="muted">One manager can be assigned to each platoon.</p><div class="scroll"><table><tr><th>Name</th><th>Login section</th></tr>${managers.map(u=>`<tr><td>${esc(u.name)}</td><td>${platoonName(u.platoon)}</td></tr>`).join('')}</table></div></section>`:'';
  const add=!isManager()?`<section class="card"><h2>Add staff or administrator</h2><form id="addstaff"><div class="row"><div><label for="newId">Username</label><input id="newId" required></div><div><label for="newName">Full name</label><input id="newName" required></div></div><div class="row"><div><label for="newPassword">Temporary password</label><input id="newPassword" required></div><div><label for="newAccess">Access</label><select id="newAccess"><option value="user">Employee</option><option value="manager">Platoon manager</option><option value="admin">Global administrator</option></select></div></div><label for="newPlatoon">Platoon / section</label><select id="newPlatoon"><option value="">Unassigned</option>${PLATOONS.map(p=>`<option value="${p}">${platoonName(p)}</option>`).join('')}</select><div class="error" id="staffError"></div><button>Add staff</button></form></section>`:'';
  return managerCard+`<section class="card"><h2>${isManager()?platoonName(current().platoon)+' staff':'Staff off balances'} (${users.length})</h2><div class="scroll"><table><tr><th>Name</th><th>Platoon</th><th>Balance</th><th>Grant history</th></tr>${rows||'<tr><td colspan="4" class="empty">No employees assigned yet.</td></tr>'}</table></div></section>${add}`}
function grantView(){const users=visibleUsers();return`<section class="card"><h2>Grant off</h2><p class="muted">Prototype grant form with the same categories as the real version.</p><form id="grant"><div class="checklist"><label><input type="checkbox" id="all"> Select all</label>${users.map(u=>`<label><input type="checkbox" name="person" value="${esc(u.id)}"> ${esc(u.name)}${u.platoon?' · '+platoonName(u.platoon):''}</label>`).join('')||'<p class="empty">Add employees first.</p>'}</div><div class="row"><div><label for="grantDays">Days for each person</label><input id="grantDays" type="number" min="0.5" step="0.5" required></div><div><label for="grantExpiry">Expires on</label><input id="grantExpiry" type="date" min="${today()}" required></div></div><div class="row"><div><label for="grantCategory">Category</label><select id="grantCategory" required><option value="">Choose a category</option><option>Events</option><option>Recalled</option><option>Awards</option></select></div><div><label for="grantRemarks">Remarks</label><input id="grantRemarks" maxlength="2000" placeholder="Optional details"></div></div><div class="error" id="grantError"></div><button>Add to balance</button></form></section>`}
function requestsView(){const rows=state.requests.filter(r=>!isManager()||state.users[r.user]?.platoon===current().platoon).sort((a,b)=>b.created-a.created);return`<section class="card"><h2>Applications</h2>${rows.length?rows.map(r=>`<div class="req"><div class="reqtop"><strong>${esc(r.name)} · ${fmt(r.start)} · ${r.days} day${r.days===1?'':'s'}</strong><span class="pill ${r.status==='approved'?'approved':r.status==='pending'?'pending':'rejected'}">${r.status}</span></div>${r.remarks?`<div class="remarks">${esc(r.remarks)}</div>`:''}${r.status==='pending'?'<div class="actions"><button data-action="approve" data-id="'+esc(r.id)+'">Approve</button><button class="bad" data-action="reject" data-id="'+esc(r.id)+'">Reject</button></div>':''}</div>`).join(''):'<p class="empty">No applications yet.</p>'}</section>`}

function notify(){save();render()}
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target.id;
  if(f==='login'){const id=$('#username').value.trim().toLowerCase(),password=$('#password').value;const u=state.users[id];if(!u||u.password!==password){$('#loginError').textContent='Username or password is incorrect.';return}session=id;localStorage.setItem(KEY+':session',session);ui={view:'dashboard',month:today().slice(0,7),selected:null};render();return}
  const u=current();if(!u)return;
  if(f==='apply'){const days=Number($('#days').value),available=balance(u)-pending(u);if(!validDate($('#start').value)||$('#start').value<today()||!days||days>available){$('#applyError').textContent='Choose valid dates and days within your available balance.';return}state.requests.push({id:'r'+state.next++,user:u.id,name:u.name,start:$('#start').value,days,remarks:$('#applyRemarks').value.trim(),status:'pending',created:Date.now()});notify();toast('Application submitted');return}
  if(f==='pattern'){const start=$('#anchor').value;if(!validDate(start)){$('#patternError').textContent='Choose a valid date.';return}state.anchor=start;ui.month=start.slice(0,7);ui.selected=start;notify();toast('Shift pattern saved');return}
  if(f==='grant'){const ids=[...document.querySelectorAll('input[name=person]:checked')].map(x=>x.value),days=Number($('#grantDays').value),expires=$('#grantExpiry').value,category=$('#grantCategory').value,remarks=$('#grantRemarks').value.trim();if(!ids.length||!days||!validDate(expires)||expires<today()||!['Events','Recalled','Awards'].includes(category)){$('#grantError').textContent='Complete the staff, days, expiry, and category fields.';return}ids.forEach(id=>{const person=state.users[id];if(person)person.batches.push({days,expires,category,remarks})});notify();toast('Off days added');return}
  if(f==='addstaff'){const id=$('#newId').value.trim().toLowerCase(),name=$('#newName').value.trim(),password=$('#newPassword').value,access=$('#newAccess').value,platoon=$('#newPlatoon').value||null;if(!/^[a-z0-9._-]{2,60}$/.test(id)||!name||!password){$('#staffError').textContent='Enter a valid username, name, and password.';return}if(state.users[id]){$('#staffError').textContent='That username already exists.';return}if(access==='manager'&&(!platoon||Object.values(state.users).some(x=>x.access==='manager'&&x.platoon===platoon))){$('#staffError').textContent='Choose an available platoon for the manager.';return}state.users[id]={id,password,name,role:access==='user'?'user':'admin',access,platoon:access==='admin'&&access!=='manager'?null:platoon,batches:[]};notify();toast('Staff added');return}
});
function closeUserMenu(){const menu=$('#user-menu'),toggle=document.querySelector('[data-action="user-menu"]');if(menu)menu.hidden=true;if(toggle)toggle.setAttribute('aria-expanded','false')}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b){if(!e.target.closest('.menu-wrap'))closeUserMenu();return}const a=b.dataset.action;
  if(a==='user-menu'){const menu=$('#user-menu'),open=menu&&!menu.hidden;if(menu)menu.hidden=open;b.setAttribute('aria-expanded',String(!open));return}
  if(a==='menu-tab'){closeUserMenu();ui.view=b.dataset.view;render();return}
  if(a==='menu-scroll'){closeUserMenu();document.getElementById(b.dataset.target)?.scrollIntoView({behavior:'smooth',block:'start'});return}
  if(a==='reset'){closeUserMenu();resetDemo();return}
  if(a==='logout'){session='';localStorage.removeItem(KEY+':session');render();return}
  if(a==='tab'){ui.view=b.dataset.view;render();return}
  if(a==='day'){ui.selected=b.dataset.date;render();return}
  if(a==='month'){const [y,m]=ui.month.split('-').map(Number),d=new Date(y,m-1+Number(b.dataset.step),1),next=iso(d).slice(0,7),min=state.anchor.slice(0,7),max=scheduleEnd().slice(0,7);ui.month=next<min?min:next>max?max:next;render();return}
  if(a==='approve'||a==='reject'){const r=state.requests.find(x=>x.id===b.dataset.id);if(!r)return;if(a==='reject'){r.status='rejected'}else{let remaining=r.days;const person=state.users[r.user];if(balance(person)<remaining){toast('Not enough balance to approve');return}for(const batch of person.batches.sort((x,y)=>x.expires.localeCompare(y.expires))){const take=Math.min(batch.days,remaining);batch.days-=take;remaining-=take;if(remaining<=0)break}r.status='approved'}notify();toast(a==='approve'?'Approved':'Rejected');return}
});
document.addEventListener('change',e=>{if(e.target.id==='all'){document.querySelectorAll('input[name=person]').forEach(x=>x.checked=e.target.checked);return}if(e.target.dataset.action==='assign'){const u=state.users[e.target.dataset.id];if(u){u.platoon=e.target.value||null;save();render();toast('Platoon updated')}}});
render();
</script>
